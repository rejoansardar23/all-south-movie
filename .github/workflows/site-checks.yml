name: Southscreen quality checks

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  site-and-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website JavaScript syntax
        run: node --check assets/app.js

      - name: Validate website runtime initialization
        run: node tools/check_runtime.js

      - name: Check frontend invariants
        run: python3 tools/check_site.py

      - name: Validate catalog and original source references
        run: python3 tools/check_catalog.py

      - name: Test multi-archive import safety
        run: python3 tools/test_multi_catalog.py

      - name: Build AWS deployment files without raw source exports
        run: |
          python3 tools/build_site.py --skip-media
          test -f dist/index.html
          test -f dist/assets/app.js
          test -f dist/data/catalog.json
          test ! -e dist/result.json
          test ! -e dist/messages.html

      - name: Set up Python for AWS template linting
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint

      - name: Validate S3 and CloudFront template
        # The certificate ARN is intentionally optional for the default CloudFront test domain.
        run: cfn-lint --ignore-checks W1030 aws/cloudfront-site.yaml

name: Check published preview

on:
  push:
    branches:
      - feature/southscreen-2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  preview-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify published GitHub Pages preview files
        shell: bash
        run: |
          set -euo pipefail
          base="https://rejoansardar23.github.io/all-south-movie"
          request() {
            local endpoint="$1" output="$2"
            for i in {1..18}; do
              if curl --fail --silent --show-error --location --max-time 20 --output "$output" "$endpoint"; then
                return 0
              fi
              echo "Attempt $i failed for $endpoint; waiting for Pages deployment..."
              sleep 8
            done
            return 1
          }
          request "$base/preview/" /tmp/ss-preview.html
          grep -q 'Southscreen 2.0 — Preview' /tmp/ss-preview.html
          grep -q 'assets/app.js?v=20261114-preview-v2' /tmp/ss-preview.html
          request "$base/preview/assets/app.js?v=20261114-preview-v2" /tmp/ss-preview.js
          grep -q "function updateSuggestions()" /tmp/ss-preview.js
          grep -q "fetch('../data/catalog.json')" /tmp/ss-preview.js
          request "$base/preview/assets/site.css?v=20261114-preview-v2" /tmp/ss-preview.css
          grep -q 'search-suggestions' /tmp/ss-preview.css
          request "$base/data/catalog.json" /tmp/ss-catalog.json
          python3 - <<'PY'
          import json
          with open('/tmp/ss-catalog.json', encoding='utf-8') as f:
              data=json.load(f)
          assert isinstance(data.get('movies'),list) and data['movies'], 'catalog missing'
          print('PASS: Pages preview HTML, JS, CSS, and %d catalog entries served over HTTPS' % len(data['movies']))
          PY

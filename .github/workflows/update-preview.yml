name: Mirror Southscreen 2.0 preview

on:
  push:
    branches:
      - feature/southscreen-2

permissions:
  contents: write

concurrency:
  group: southscreen-preview-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Point short preview branch to the latest development commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: 'heads/southscreen-2-preview',
              sha: context.sha,
              force: true
            });
            core.info('Updated southscreen-2-preview to ' + context.sha);
